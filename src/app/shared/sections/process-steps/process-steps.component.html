<ui-section sectionId="proceso" spacing="compact">
  <div class="process" [appRevealGroup]="reveal">
    <ui-section-heading
      [title]="'application.home.process.label' | translate"
      [subtitle]="'application.home.process.note' | translate"
    />
    <ol class="process__steps" role="list">
      @for (step of steps; track step.id; let i = $index, first = $first) {
        <li class="process__step" [class.is-current]="first">
          @if (!$last) {
            <span class="process__link" aria-hidden="true"></span>
          }
          <span class="process__marker" aria-hidden="true">{{ i | position }}</span>
          <div class="process__body">
            <p class="process__head">
              <span class="process__title">{{ step.titleKey | translate }}</span>
              @if (first) {
                <ui-tag tone="accent">{{ 'application.home.process.start' | translate }}</ui-tag>
              }
            </p>
            <p class="process__text">{{ step.textKey | translate }}</p>
          </div>
        </li>
      }
    </ol>
  </div>
</ui-section>
