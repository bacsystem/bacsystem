<form class="brief" [formGroup]="form" (ngSubmit)="send()" novalidate>
  <h2 class="brief__title">{{ 'application.site.contactPage.form.title' | translate }}</h2>

  <div class="brief__row">
    <ui-field [label]="'application.site.contactPage.form.name' | translate" [error]="errorFor('name') ? (errorFor('name')! | translate) : undefined">
      <input type="text" formControlName="name" autocomplete="name" maxlength="80" required />
    </ui-field>
    <ui-field [label]="'application.site.contactPage.form.company' | translate">
      <input type="text" formControlName="company" autocomplete="organization" maxlength="80" />
    </ui-field>
  </div>

  <ui-field
    [label]="'application.site.contactPage.form.need' | translate"
    [hint]="'application.site.contactPage.form.needHint' | translate"
    [error]="errorFor('need') ? (errorFor('need')! | translate) : undefined"
  >
    <textarea formControlName="need" rows="4" maxlength="600" required></textarea>
  </ui-field>

  <ui-field [label]="'application.site.contactPage.form.when.label' | translate">
    <select formControlName="when">
      @for (option of whenOptions; track option) {
        <option [value]="option">{{ 'application.site.contactPage.form.when.options.' + option | translate }}</option>
      }
    </select>
  </ui-field>

  <div class="brief__actions">
    <button ui-button size="lg" type="submit">
      <ui-icon name="whatsapp" size="sm" />
      {{ 'application.site.contactPage.form.submit' | translate }}
    </button>
    <p class="brief__note">{{ 'application.site.contactPage.form.note' | translate }}</p>
  </div>
</form>
